[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with constrained decoding on Qwen3-0.6B"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    "llm-sdk",
    "numpy>=2.0",
    "pydantic>=2.0",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }

[dependency-groups]
dev = ["flake8>=7.0", "mypy>=1.10"]

[tool.mypy]
exclude = [
    '^llm_sdk/',
    '^\.venv/',
    '^\.git/',
    '__pycache__',
    '^\.mypy_cache/'
]
